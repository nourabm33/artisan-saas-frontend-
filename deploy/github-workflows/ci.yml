name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.it

  docker-smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: artisan-saas-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.it
            APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name fe -p 3001:3001 artisan-saas-frontend:ci
          for i in $(seq 1 20); do curl -fsS localhost:3001/api/health && break; sleep 2; done
          curl -fsS -o /dev/null -w '%{http_code}\n' localhost:3001/login
          curl -sSI localhost:3001/login | grep -i 'x-frame-options: DENY'
          docker rm -f fe
